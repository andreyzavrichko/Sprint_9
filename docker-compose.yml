version: "3.8"

services:

  selenoid:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid
    ports:
      - "4444:4444"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
      - /tmp/selenoid:/tmp/selenoid
    command: >
      -conf /etc/selenoid/browsers.json
      -container-network sprint_9_default
      -video-output-dir /tmp/selenoid/video
      -log-output-dir /tmp/selenoid/logs
      -limit 4

  tests:
    build: .
    container_name: autotests
    depends_on:
      - selenoid
    command: >
      pytest
      --selenoid-uri http://selenoid:4444/wd/hub
      --headless
      -v